services:
  - type: web
    name: codementor-ai-service
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      # Python version is pinned by the Docker base image (python:3.11-slim).
      # Secret: leave blank in the blueprint and set the real value in the
      # Render dashboard (never commit it). sync: false = prompt on first deploy.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: GROQ_TIMEOUT
        value: "300"
